<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マンガでオノマトペ クイズ</title>
<style>
:root{--bg:#f3f0e6;--paper:#fffdf7;--ink:#1d2340;--sub:#5b6080;--line:#d8d2bf;--ok:#e0a800;--okbg:#fff4cc;--okt:#7a5700;--ng:#c8321f;--ngbg:#fde3de;--btn:#1d2340;--btntx:#fffdf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152a;--paper:#1c2040;--ink:#f1eee2;--sub:#a9adc8;--line:#363b66;--ok:#ffc928;--okbg:#3a3416;--okt:#ffc928;--ng:#ff6b57;--ngbg:#43201f;--btn:#f1eee2;--btntx:#12152a}}
:root[data-theme="dark"]{--bg:#12152a;--paper:#1c2040;--ink:#f1eee2;--sub:#a9adc8;--line:#363b66;--ok:#ffc928;--okbg:#3a3416;--okt:#ffc928;--ng:#ff6b57;--ngbg:#43201f;--btn:#f1eee2;--btntx:#12152a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Yu Gothic","Meiryo",sans-serif;line-height:1.8}
header{background:var(--btn);color:var(--btntx)}
header div{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:1.05rem}
header nav{display:flex;gap:14px;font-size:.95rem}
header nav a{color:inherit;text-decoration:none;border-bottom:2px solid transparent}
header nav a:hover,header nav a:focus-visible{border-color:var(--ok);outline:0}
main{max-width:860px;margin:0 auto;padding:0 16px 60px}
section{padding:28px 0}
h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.3;margin:0 0 8px}
h2{font-size:1.4rem;margin:0 0 12px}
.lead{color:var(--sub);margin:0 0 16px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
.hero .art{display:flex;justify-content:center;align-items:flex-end;gap:12px;min-height:150px}
.hero .art svg{width:90px;height:90px;animation:jump 1.1s ease-in-out infinite}
.hero .art svg:nth-child(2){animation-delay:.25s}
.hero .art svg:nth-child(3){animation-delay:.5s}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.05,.92)}45%{transform:translateY(-46px) scale(.95,1.08) rotate(-8deg)}60%{transform:translateY(-46px) rotate(8deg)}}
.how{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.how div{background:var(--paper);border:2px dashed var(--line);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.how svg{width:36px;height:36px;flex:none}
.name{display:flex;gap:8px;align-items:center;margin:14px 0}
.name input{flex:1;max-width:260px;font:inherit;color:var(--ink);background:var(--paper);border:0;border-bottom:2px solid var(--ink);padding:4px 8px;min-width:0}
.go{font:inherit;font-weight:700;font-size:1.1rem;padding:12px 28px;border-radius:999px;border:0;background:var(--btn);color:var(--btntx);cursor:pointer}
.go:focus-visible,.opt:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.go:disabled{opacity:.4;cursor:default}
#quiz,#result{display:none;border-top:2px solid var(--line)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.92rem;margin-bottom:14px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:18px 18px 20px}
.card.ok{border-color:var(--ok);background:var(--okbg)}
.card.ng{border-color:var(--ng);background:var(--ngbg)}
.card,.opt{position:relative}
.card.ok,.opt.right{animation:glow 1.2s ease-in-out 3}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,40,0)}50%{box-shadow:0 0 24px 8px rgba(255,201,40,.9)}}
.card.ok::before,.card.ok::after,.opt.right::before,.opt.right::after{content:"✦";position:absolute;color:#ffc928;font-size:1.7rem;line-height:1;pointer-events:none;animation:twinkle .9s ease-in-out infinite}
.card.ok::before{top:-12px;left:12px}
.card.ok::after{content:"✧";bottom:-10px;right:20px;animation-delay:.3s}
.opt.right::before{top:-14px;right:14px}
.opt.right::after{content:"✧";bottom:-12px;left:30px;animation-delay:.45s}
@keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:0}50%{transform:scale(1.25) rotate(45deg);opacity:1}}
.card.ng,.opt.wrong{animation:zap .6s steps(1) 3}
@keyframes zap{0%{border-color:#ffe94d;box-shadow:0 0 18px 4px #ffe94d;transform:translateX(-4px)}20%{border-color:var(--ng);box-shadow:none;transform:translateX(4px)}40%{border-color:#fff;box-shadow:0 0 28px 8px #fff3a0;transform:translateX(-3px)}60%{border-color:var(--ng);box-shadow:none;transform:none}100%{border-color:var(--ng);transform:none}}
.card.ng::before,.card.ng::after,.opt.wrong::before,.opt.wrong::after{content:"⚡";position:absolute;font-size:1.7rem;line-height:1;pointer-events:none;animation:flash .5s steps(1) 4}
.card.ng::before{top:-14px;left:10px}
.card.ng::after{bottom:-14px;right:14px;animation-delay:.15s}
.opt.wrong::before{top:-14px;right:16px}
.opt.wrong::after{bottom:-14px;left:24px;animation-delay:.15s}
@keyframes flash{0%{opacity:1;transform:scale(1.4)}50%{opacity:0}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.card,.opt,.card::before,.card::after,.opt::before,.opt::after{animation:none!important}}
.qn{font-weight:700;color:var(--sub)}
.qt{font-size:1.2rem;font-weight:700;margin:2px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--paper);border:2px solid var(--btn);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--btn);color:var(--btntx)}
.opt .no{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-weight:700}
.opt:disabled{cursor:default;opacity:.5}
.opt.right{opacity:1;border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.opt.wrong{opacity:1;border-color:var(--ng);box-shadow:0 0 0 3px var(--ng)}
.fb{display:none;margin-top:14px}
.card.ok .fb,.card.ng .fb{display:block}
.fb strong{display:block;font-size:1.1rem}
.card.ok .fb strong{color:var(--okt)}
.card.ng .fb strong{color:var(--ng)}
.jumpers{display:flex;justify-content:center;gap:10px;height:96px;align-items:flex-end;margin-bottom:6px}
.jumpers svg{width:64px;height:64px;animation:jump .7s ease-out 4}
.jumpers svg:nth-child(2){animation-delay:.12s}
.jumpers svg:nth-child(3){animation-delay:.24s}
.next{margin-top:14px}
#result{text-align:center}
#result .big{font-size:2.6rem;font-weight:700;line-height:1.3}
#result .row{display:flex;justify-content:center;gap:30px;margin:10px 0;font-size:1.4rem;font-weight:700}
#result .row span{display:flex;align-items:center;gap:8px}
#result .row svg{width:40px;height:40px}
.rv{text-align:left;max-width:560px;margin:14px auto;padding:0;list-style:none;font-size:.95rem}
.rv li{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.rv svg{width:22px;height:22px;flex:none}
footer{max-width:860px;margin:0 auto;padding:16px;color:var(--sub);font-size:.85rem;border-top:1px solid var(--line)}
@media (max-width:600px){.hero{grid-template-columns:1fr}.how{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.hero .art svg,.jumpers svg{animation:none}}
</style>
</head>
<body>
<header><div><b>マンガでオノマトペ</b><nav><a href="#top">はじめに</a><a href="#quiz">クイズ</a><a href="#result">けっか</a></nav></div></header>
<main>
<section id="top" class="hero">
<div>
<h1>オノマトペ クイズ</h1>
<p class="lead">マンガに出てきた音や様子のことばについて、全部で20問。1・2・3・4の中から答えを選んでください。</p>
<div class="how">
<div><svg viewBox="0 0 64 64"><use href="#star"/></svg>正解 → 星がジャンプ！</div>
<div><svg viewBox="0 0 64 64"><use href="#oni"/></svg>まちがい → 鬼がジャンプ！</div>
</div>
<div class="name"><label for="nm">名前</label><input id="nm" type="text" autocomplete="off"></div>
<button class="go" id="start">スタート</button>
</div>
<div class="art" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#star"/></svg><svg viewBox="0 0 64 64"><use href="#oni"/></svg><svg viewBox="0 0 64 64"><use href="#star"/></svg></div>
</section>

<section id="quiz" aria-live="polite">
<h2>クイズ</h2>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="prog"></span><span id="live"></span></div>
<div class="card" id="card">
<div class="qn" id="qn"></div><div class="qt" id="qt"></div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb"><div class="jumpers" id="jp"></div><strong id="fs"></strong><span id="fe"></span><div class="next"><button class="go" id="next">つぎへ</button></div></div>
</div>
</section>

<section id="result" aria-live="polite">
<h2>けっか</h2>
<div class="big" id="rt"></div>
<div class="row"><span><svg viewBox="0 0 64 64"><use href="#star"/></svg><b id="rs">0</b></span><span><svg viewBox="0 0 64 64"><use href="#oni"/></svg><b id="rn">0</b></span></div>
<p id="rm"></p>
<ul class="rv" id="rv"></ul>
<button class="go" id="again">もう一度チャレンジ</button>
</section>
</main>
<footer>マンガでオノマトペを楽しもう（国際交流基金関西国際センター）の内容をもとに作った練習問題です。</footer>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="star" viewBox="0 0 64 64"><path d="M32 4l7.6 17.6 19 1.7-14.4 12.5 4.3 18.6L32 44.6 15.5 54.4l4.3-18.6L5.4 23.3l19-1.7z" fill="#ffc928" stroke="#b07d00" stroke-width="3" stroke-linejoin="round"/><circle cx="26" cy="30" r="2" fill="#5a3d00"/><circle cx="38" cy="30" r="2" fill="#5a3d00"/><path d="M27 37q5 4 10 0" stroke="#5a3d00" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
<symbol id="oni" viewBox="0 0 64 64"><path d="M16 22L12 6l14 10zM48 22l4-16-14 10z" fill="#f4e7c4" stroke="#6b1a10" stroke-width="2.5" stroke-linejoin="round"/><circle cx="32" cy="36" r="24" fill="#d63a24" stroke="#6b1a10" stroke-width="3"/><path d="M16 27l11 5M48 27l-11 5" stroke="#2a0905" stroke-width="4" stroke-linecap="round"/><circle cx="23" cy="35" r="3" fill="#fff"/><circle cx="41" cy="35" r="3" fill="#fff"/><path d="M20 47q12-8 24 0" stroke="#2a0905" stroke-width="3" fill="#2a0905" stroke-linecap="round"/><path d="M25 45l2 6 3-5zM39 45l-2 6-3-5z" fill="#fff"/></symbol>
</defs></svg>

<script>
const Q=[
["「パシャ パシャ」は、どんな場面で出てきましたか。",["雨の中を走る場面","顔を洗う場面","紙を破る場面","ドアを閉める場面"],1,"水で顔を洗う場面でした。"],
["「ざぶ ざぶ」は、何の音ですか。",["雨を飲む音","学校のチャイム","川で服を洗う音","首筋をかく音"],2,"男の人が水の中で服を洗っていました。"],
["「テク テク テク・・・」は、何を表していますか。",["歩く足音","水を飲む音","紙をにぎる音","雨の音"],0,"歩いている足元の場面でした。"],
["「カツ カツ」が出てきたのは、どの場面ですか。",["顔を洗う場面","雨が降る場面","テストの場面","スーツの男の人が歩く場面"],3,"かたい靴で歩く音を表しています。"],
["「ずだだだ」は、どんな場面で出てきましたか。",["ゆっくり歩く場面","走って逃げる場面","水を飲む場面","紙をにぎる場面"],1,"「鬼ィ！」と言いながら走って逃げる場面でした。"],
["濁音「゛」は、何を表しますか。",["小さい音、ゆっくりした動作","スピード感","大きい音、活発な動作","悲しい気持ち"],2,"濁音は大きい音や活発な動作を表します。"],
["促音「っ」は、何を表現しますか。",["大きい音","ゆっくりな動き","小さい音","スピード感"],3,"促音は速さや勢いを出します。"],
["母音は、どの順に大きい音を表しますか。",["i→u→e→o→a","a→o→e→u→i","a→i→u→e→o","o→a→e→i→u"],1,"aがいちばん大きく、iがいちばん小さい音です。"],
["母音のなかで、いちばん小さい音を表すのはどれですか。",["a","o","i","e"],2,"いちばん小さい音を表すのは「i」です。"],
["「ガガーン」は、どんなようすですか。",["一斉に座るようす","雨が強くなるようす","よくないできごとにショックを受けるようす","ぼんやりしたようす"],2,"テストの点数が悪くてショックを受ける場面でした。"],
["「くしゅっ」は、何をしている音ですか。",["けしゴムで消す","首筋をかく","雨を飲む","紙をにぎりつぶす"],3,"テストの紙をにぎりつぶす音です。"],
["「ブーブー！」は、何を表していますか。",["拍手","ブーイング","チャイム","ため息"],1,"不満を表すブーイングです。"],
["「ガタ ガタ」は、教室で何をしている音ですか。",["一斉に座る","熱心に書く","傷がうずく","雨が降る"],0,"テストの前に、みんなが一斉に座る音です。"],
["「カリ カリ カリ・・・」は、どんなようすですか。",["けしゴムで消している","熱心に書いている","首筋をかいている","ふらふらしている"],1,"テスト中、熱心に書いている音です。"],
["「ゴシ ゴシ」は、何をしている音ですか。",["熱心に書いている","学校のチャイム","紙をにぎりつぶす","けしゴムで消している"],3,"けしゴムで消している音です。"],
["「キーン コーン カーン」は、何の音ですか。",["雨の音","電話の音","学校のチャイム音","足音"],2,"学校のチャイム音です。"],
["「ポッ ポッ ポッ ポッ」は、どんなようすですか。",["雨が降りはじめる","雨が強くなる","雨を飲む","起き上がる"],0,"雨がひとつぶずつ降りはじめるようすです。"],
["「ザー・・・」は、どんなようすですか。",["雨が降りはじめる","雨がやむ","雨が強くなる","雨が弱くなる"],2,"雨が強くなるようすです。"],
["「フラ フラ」は、どんなようすですか。",["首筋をかいている","ふらふらとよろつくようす","ぼんやりしたようす","傷がうずくようす"],1,"ふらふらとよろつくようすです。"],
["「うっ」は、どんなときの音ですか。",["雨が降りはじめるとき","熱心に書いているとき","傷がうずくとき","ゆっくり起き上がるとき"],2,"傷がうずくときのオノマトペです。"]
];
const $=id=>document.getElementById(id),show=(id,v)=>$(id).style.display=v?"block":"none";
const calm=matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth";
let i,star,oni,log,locked;
function begin(){i=star=oni=0;log=[];show("quiz",1);show("result",0);render();$("quiz").scrollIntoView({behavior:calm})}
function render(){
const x=Q[i];locked=false;
$("card").className="card";$("qn").textContent="第"+(i+1)+"問";$("qt").textContent=x[0];
$("opts").innerHTML="";
x[1].forEach((t,k)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.innerHTML='<span class="no">'+(k+1)+'</span><span></span>';b.lastChild.textContent=t;b.onclick=()=>pick(k);$("opts").appendChild(b)});
$("prog").textContent=(i+1)+" / "+Q.length+" 問";$("live").textContent="星 "+star+"　鬼 "+oni;
$("fill").style.width=i/Q.length*100+"%";
$("next").textContent=i===Q.length-1?"けっかを見る":"つぎへ";
}
function pick(k){
if(locked)return;locked=true;
const x=Q[i],right=k===x[2],bs=$("opts").children;
[...bs].forEach(b=>b.disabled=true);
bs[x[2]].classList.add("right");if(!right)bs[k].classList.add("wrong");
$("card").classList.add(right?"ok":"ng");
$("fs").textContent=right?"せいかい！ キラキラ光って、星がジャンプしました。":"ざんねん… 雷が落ちて、鬼がジャンプしました。正解は "+(x[2]+1)+" です。";
$("fe").textContent=x[3];
$("jp").innerHTML=(right?'<svg viewBox="0 0 64 64"><use href="#star"/></svg>':'<svg viewBox="0 0 64 64"><use href="#oni"/></svg>').repeat(3);
right?star++:oni++;log.push(right);
$("live").textContent="星 "+star+"　鬼 "+oni;
$("fill").style.width=(i+1)/Q.length*100+"%";
$("next").focus({preventScroll:true});
}
function next(){
if(i<Q.length-1){i++;render();return}
const n=$("nm").value.trim();
$("rt").textContent=star+" / 20 点";$("rs").textContent=star;$("rn").textContent=oni;
$("rm").textContent=(n?n+"さん、":"")+(star===20?"全問せいかい！ オノマトペはかんぺきです。":star>=16?"すばらしい！ あと少しでかんぺきです。":star>=11?"よくできました。鬼が出た問題をもう一度見てみましょう。":"マンガをもう一度見て、音と意味を確かめましょう。");
$("rv").innerHTML=log.map((r,k)=>'<li><svg viewBox="0 0 64 64"><use href="#'+(r?"star":"oni")+'"/></svg>第'+(k+1)+'問　'+Q[k][1][Q[k][2]]+'</li>').join("");
show("quiz",0);show("result",1);$("result").scrollIntoView({behavior:calm});
}
$("start").onclick=begin;$("next").onclick=next;$("again").onclick=()=>{show("result",0);scrollTo({top:0,behavior:calm})};
document.addEventListener("keydown",e=>{
if($("quiz").style.display!=="block")return;
if(e.key>="1"&&e.key<="4")pick(+e.key-1);
});
</script>
</body>
</html>
